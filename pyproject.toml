[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csi-video-ground-truth"
version = "0.1.0"
description = "Timestamped camera frame delivery and visual analysis for CSI-LAB"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy==1.26.4", "opencv-python==4.10.0.84"]

[project.optional-dependencies]
inference = ["ultralytics==8.4.7"]

[project.scripts]
csi-video = "backend.cli:main"
csi-video-live = "backend.live:main"
csi-framegrabber = "framegrabber.cli:main"
csi-backend = "backend.live:main"

[tool.setuptools]
packages = ["backend", "framegrabber"]
package-dir = {backend = "CSI-LAB-CV-ML", framegrabber = "CSI-LAB-camera"}

[tool.setuptools.package-data]
backend = ["*.html"]
